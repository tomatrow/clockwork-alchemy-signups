packages:
  - packages/*
# Every dependency is pinned exactly; `pnpm add` keeps it that way. Bump
# deliberately — kit/adapter-cloudflare pre-releases must move together.
saveExact: true
allowBuilds:
  "@parcel/watcher": true
  # pocketbase-typegen's sqlite path (reading data.db directly). We use its
  # --env/API path instead, but the native module still has to build to import.
  better-sqlite3: true
  esbuild: true
  svelte-preprocess: false
  # Cloudflare's local Workers runtime; postinstall downloads the platform
  # binary. Needed by wrangler / adapter-cloudflare's dev platform proxy.
  workerd: true
